<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番頭さん — 選んで登場デザイン案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --washi:#F6F1E5; --ink:#2B2620;
    --ai:#22436B; --ai-deep:#18314F;
    --shu:#A93A28; --matsu:#3E6B4F;
    --line:#D8CEB8; --card:#FFFDF7;
    --c-hari:#22436B; --c-fude:#5B4A6B; --c-fure:#3E6B4F;
    --c-koyo:#8A6D2F; --c-hike:#A93A28; --c-kura:#4F4A42;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"BIZ UDPGothic",sans-serif;background:#E9E2D0;color:var(--ink);font-size:17px;line-height:1.7;}
  .disp{font-family:"Shippori Mincho B1",serif;}

  .stage{max-width:1100px;margin:0 auto;padding:24px 16px 64px;}
  .stage-head{max-width:900px;margin:0 auto 14px;}
  .stage-head h1{font-size:21px;font-weight:800;}
  .stage-head p{font-size:14.5px;color:#5C544A;}
  .viewbar{display:flex;gap:8px;max-width:900px;margin:0 auto 16px;}
  .viewbar button{font-family:inherit;font-size:14px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--ai);background:transparent;color:var(--ai);cursor:pointer;min-height:38px;}
  .viewbar button.on{background:var(--ai);color:#fff;font-weight:700;}

  .frame{
    max-width:900px;margin:0 auto;background:var(--washi);
    border-radius:20px;box-shadow:0 12px 40px rgba(43,38,32,.25);
    overflow:hidden;height:640px;display:flex;flex-direction:column;border:1px solid var(--line);
  }
  .noren{background:var(--ai-deep);color:#fff;padding:12px 20px 0;flex:none;}
  .noren .row{display:flex;align-items:center;gap:10px;padding-bottom:10px;}
  .kamon{width:38px;height:38px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex:none;}
  .noren .title{font-size:19px;font-weight:800;letter-spacing:.06em;}
  .noren .sub{font-size:11.5px;opacity:.85;}
  .noren::after{content:"";display:block;height:11px;
    background:radial-gradient(circle at 12.5% 0, transparent 10px, var(--washi) 11px),var(--ai-deep);
    background-size:25% 11px;background-repeat:repeat-x;}

  .layout{flex:1;display:flex;min-height:0;}

  /* ===== チャット側 ===== */
  .chat-pane{flex:1.3;display:flex;flex-direction:column;border-right:1.5px solid var(--line);min-width:0;}
  .chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
  .msg{display:flex;gap:9px;align-items:flex-end;max-width:92%;}
  .msg.me{align-self:flex-end;flex-direction:row-reverse;}
  .msg.sys{align-self:center;max-width:100%;}
  .sys .bub{background:transparent;border:none;color:#8a8072;font-size:13px;text-align:center;padding:2px;}
  .face{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;background:var(--ai);}
  .bub{background:var(--card);border:1.5px solid var(--line);border-radius:4px 12px 12px 12px;padding:10px 13px;font-size:16px;}
  .msg .who{font-size:11.5px;color:#5C544A;margin-bottom:2px;font-weight:700;}
  .msg.me .bub{background:#DDE7F2;border-color:#B9CCE0;border-radius:12px 4px 12px 12px;}
  .typing{display:inline-flex;gap:5px;padding:5px 2px;}
  .typing span{width:7px;height:7px;border-radius:50%;background:#9AA9BC;animation:bl 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.typing span{animation:none}}

  .inputbar{flex:none;display:flex;gap:8px;padding:10px 12px 14px;background:#EFE8D6;}
  .inputbar input{flex:1;font-family:inherit;font-size:16px;border:2px solid var(--line);border-radius:999px;padding:11px 16px;background:var(--card);min-height:46px;}
  .inputbar input:focus{outline:3px solid #7FA3CC;}
  .send{width:46px;height:46px;border-radius:50%;border:none;background:var(--ai);color:#fff;font-size:19px;cursor:pointer;flex:none;}

  /* ===== グリッド側 ===== */
  .grid-pane{flex:1;display:flex;flex-direction:column;min-width:0;background:#EFE8D6;}
  .grid-head{padding:16px 16px 10px;text-align:center;flex:none;}
  .grid-head p{font-size:16.5px;font-weight:700;}
  .grid-wrap{flex:1;overflow-y:auto;padding:6px 14px 14px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .fuda{
    position:relative;border-radius:14px;overflow:hidden;cursor:pointer;
    border:2.5px solid var(--line);background:var(--card);font-family:inherit;padding:0;text-align:center;
    transition:transform .15s, box-shadow .15s;
  }
  .fuda .obi2{color:#fff;font-size:30px;padding:16px 0 8px;position:relative;}
  .fuda .nm{font-size:14.5px;font-weight:800;padding:2px 4px 10px;}
  .fuda.active{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink);}
  .fuda.pop{animation:pop .5s ease;}
  @keyframes pop{
    0%{transform:scale(1)}
    35%{transform:scale(1.18)}
    60%{transform:scale(0.94)}
    100%{transform:scale(1)}
  }
  .kasumi-burst{
    position:absolute;inset:0;border-radius:14px;pointer-events:none;
    background:radial-gradient(circle, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 65%);
    opacity:0;
  }
  .fuda.pop .kasumi-burst{animation:burst .5s ease;}
  @keyframes burst{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}

  .note{max-width:900px;margin:14px auto 0;font-size:13.5px;color:#5C544A;line-height:1.7;}

  /* ===== スマホ表示モード ===== */
  .frame.mobile{max-width:380px;height:760px;}
  .frame.mobile .layout{flex-direction:column;}
  .frame.mobile .chat-pane{border-right:none;flex:1;}
  .frame.mobile .grid-pane{
    flex:none;max-height:230px;border-top:1.5px solid var(--line);
  }
  .frame.mobile .grid-head{padding:8px 14px 4px;display:flex;justify-content:space-between;align-items:center;text-align:left;}
  .frame.mobile .grid-head p{font-size:14px;}
  .frame.mobile .grid-head button{font-family:inherit;font-size:13px;background:none;border:none;color:var(--ai);text-decoration:underline;min-height:34px;}
  .frame.mobile .grid-wrap{padding:2px 12px 12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;}
  .frame.mobile .grid-wrap::-webkit-scrollbar{height:6px;}
  .frame.mobile .grid-wrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .frame.mobile .grid{display:flex;gap:10px;width:max-content;}
  .frame.mobile .fuda{width:108px;flex:none;scroll-snap-align:start;}
  .frame.mobile .fuda .obi2{font-size:28px;padding:14px 0 7px;}
  .frame.mobile .fuda .nm{font-size:13.5px;padding:0 3px 10px;}
  .frame.mobile .grid-pane{max-height:none;}
  .frame.mobile.collapsed .grid-wrap{display:none;}
</style>
</head>
<body>
<div class="stage">
  <div class="stage-head">
    <h1>番頭さん — 選んで登場デザイン案</h1>
    <p>右のグリッドから番頭さんをタップすると、その番頭さんが登場して引き継ぎます。表示幅を切り替えて見え方を比較できます。</p>
  </div>
  <div class="viewbar">
    <button class="on" id="vDesktop">PC・タブレット幅（左右分割）</button>
    <button id="vMobile">スマホ幅（横スクロールの帯）</button>
  </div>

  <div class="frame" id="frame">
    <header class="noren">
      <div class="row">
        <div class="kamon disp">番</div>
        <div>
          <div class="title disp">番頭さん</div>
          <div class="sub">さくら台マンション管理組合・帳場</div>
        </div>
      </div>
    </header>

    <div class="layout">
      <section class="chat-pane">
        <div class="chat" id="chat">
          <div class="msg">
            <div class="face" style="background:var(--ai)">🙂</div>
            <div>
              <p class="who">大番頭さん</p>
              <div class="bub"><span class="disp">おはようございます、田中さん。</span><br>あなたはどの番頭さんにお願いしたいですか？<br>右からお選びください。</div>
            </div>
          </div>
        </div>
        <div class="inputbar">
          <input id="inp" type="text" placeholder="番頭さんを選んでからどうぞ" aria-label="番頭さんへの伝言" disabled>
          <button class="send" id="sendBtn" aria-label="送る">➤</button>
        </div>
      </section>

      <aside class="grid-pane">
        <div class="grid-head">
          <p>番頭さんを選ぶ</p>
          <button id="collapseBtn" style="display:none">たたむ</button>
        </div>
        <div class="grid-wrap">
          <div class="grid" id="grid">
            <button class="fuda" data-b="hari"><span class="kasumi-burst"></span><div class="obi2" style="background:var(--c-hari)">📜</div><div class="nm">はり出し<br>番頭</div></button>
            <button class="fuda" data-b="fude"><span class="kasumi-burst"></span><div class="obi2" style="background:var(--c-fude)">🖋️</div><div class="nm">筆どめ<br>番頭</div></button>
            <button class="fuda" data-b="fure"><span class="kasumi-burst"></span><div class="obi2" style="background:var(--c-fure)">📣</div><div class="nm">触れ回り<br>番頭</div></button>
            <button class="fuda" data-b="koyo"><span class="kasumi-burst"></span><div class="obi2" style="background:var(--c-koyo)">📅</div><div class="nm">暦<br>番頭</div></button>
            <button class="fuda" data-b="hike"><span class="kasumi-burst"></span><div class="obi2" style="background:var(--c-hike)">🔔</div><div class="nm">火消し<br>番頭</div></button>
            <button class="fuda" data-b="kura"><span class="kasumi-burst"></span><div class="obi2" style="background:var(--c-kura)">🗄️</div><div class="nm">蔵<br>番頭</div></button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <p class="note">※デザイン確認用の見本です。カードをタップすると「ポン」と一拍置いて番頭さんが名乗ります。もう一度別のカードを押すと、大番頭が取り次いで交代します。スマホ幅では「たたむ」でグリッドを隠し、会話に集中できます。</p>
</div>

<script>
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');
const sendBtn = document.getElementById('sendBtn');
const frame = document.getElementById('frame');

const B = {
  hari: {name:'はり出し番頭さん', face:'📜', color:'var(--c-hari)', greet:'はり出し番頭、参りました。お知らせについて、さあどうぞ。'},
  fude: {name:'筆どめ番頭さん',   face:'🖋️', color:'var(--c-fude)', greet:'筆どめ番頭でございます。議事録について、さあどうぞ。'},
  fure: {name:'触れ回り番頭さん', face:'📣', color:'var(--c-fure)', greet:'触れ回り番頭です。配りものについて、さあどうぞ。'},
  koyo: {name:'暦番頭さん',       face:'📅', color:'var(--c-koyo)', greet:'暦番頭です。時期や締切のことなら、さあどうぞ。'},
  hike: {name:'火消し番頭さん',   face:'🔔', color:'var(--c-hike)', greet:'火消し番頭、参上。緊急のご用でしたら、さあどうぞ。'},
  kura: {name:'蔵番頭さん',       face:'🗄️', color:'var(--c-kura)', greet:'蔵番頭です。過去の記録のことなら、さあどうぞ。'},
};

let current = null;

function addMsg(who, html, opts={}){
  const div = document.createElement('div');
  if (opts.me) {
    div.className = 'msg me';
    div.innerHTML = `<div class="bub">${html}</div>`;
  } else if (opts.sys) {
    div.className = 'msg sys';
    div.innerHTML = `<div class="bub">${html}</div>`;
  } else {
    const b = B[who];
    div.className = 'msg';
    div.innerHTML = `<div class="face" style="background:${b.color}">${b.face}</div>
      <div><p class="who">${b.name}</p><div class="bub">${html}</div></div>`;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
function addTyping(who){
  const b = B[who];
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = `<div class="face" style="background:${b.color}">${b.face}</div>
    <div><p class="who">${b.name}</p><div class="bub"><span class="typing"><span></span><span></span><span></span></span></div></div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

document.querySelectorAll('.fuda').forEach(f => f.addEventListener('click', () => {
  const b = f.dataset.b;
  if (current === b) return;

  // ポン、と登場アニメーション
  document.querySelectorAll('.fuda').forEach(x => { x.classList.remove('active'); x.classList.remove('pop'); });
  void f.offsetWidth; // reflow でアニメーション再トリガー
  f.classList.add('pop');
  f.classList.add('active');
  f.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});

  if (current) {
    addMsg(null, `→ 大番頭が「${B[current].name.replace('さん','')}」から「${B[b].name.replace('さん','')}」へお取り次ぎしました`, {sys:true});
  }
  current = b;

  const t = addTyping(b);
  setTimeout(() => {
    t.remove();
    addMsg(b, B[b].greet);
    inp.disabled = false;
    inp.placeholder = B[b].name + 'に伝える';
  }, 550);
}));

function send(){
  const text = inp.value.trim();
  if (!text || !current) return;
  addMsg(null, escapeHtml(text), {me:true});
  inp.value = '';
  const t = addTyping(current);
  setTimeout(() => { t.remove(); addMsg(current, '承知しました。（この先は実装で本物のやりとりになります）'); }, 900);
}
sendBtn.addEventListener('click', send);
inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
function escapeHtml(s){return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// 表示幅の切り替え
document.getElementById('vDesktop').addEventListener('click', () => {
  frame.classList.remove('mobile','collapsed');
  document.getElementById('vDesktop').classList.add('on');
  document.getElementById('vMobile').classList.remove('on');
});
document.getElementById('vMobile').addEventListener('click', () => {
  frame.classList.add('mobile');
  document.getElementById('vMobile').classList.add('on');
  document.getElementById('vDesktop').classList.remove('on');
  document.getElementById('collapseBtn').style.display = 'inline';
});
document.getElementById('collapseBtn').addEventListener('click', function(){
  const collapsed = frame.classList.toggle('collapsed');
  this.textContent = collapsed ? '開く' : 'たたむ';
});
</script>
</body>
</html>
